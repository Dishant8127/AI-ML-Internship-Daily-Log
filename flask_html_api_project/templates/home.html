<!DOCTYPE html>
<html>
<head>
    <title>Home</title>
</head>
<body style="font-family: Arial; margin:0;">

<!-- Navbar -->
<div style="background:#2c3e50; padding:15px;">
    <a href="/" style="color:white; margin-right:20px;">Home</a>
    <a href="/contact" style="color:white;">Contact</a>
</div>

<div style="padding:40px;">

    <h1>🏠 Home Page</h1>
    
    <form action="/" method="POST">
        <button type="submit">Show API Message</button>
    </form>

    <!-- Show message if exists -->
    {% if message %}
        <p style="color:green; font-size:18px; margin-top:20px;">
            {{ message }}
        </p>
    {% endif %}

</div>

</body>
</html>

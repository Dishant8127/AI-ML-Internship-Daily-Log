<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Visual Search</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container py-5 min-vh-100 d-flex flex-column justify-content-center align-items-center">
    
    <div class="col-lg-8 col-md-10 w-100">
        <div class="glass-card animate-fade-in text-center p-5">
            
            <div class="mb-4">
                <i class="bi bi-search text-gradient" style="font-size: 3rem;"></i>
            </div>
            
            <h1 class="mb-3 text-gradient">Visual Similarity Search</h1>
            <p class="text-muted mb-5 fs-5">
                Discover visually similar items instantly using Deep Learning. Just upload an image!
            </p>

            <form action="/search" method="POST" enctype="multipart/form-data" class="mx-auto" style="max-width: 500px;">
                
                <div class="custom-file-upload mb-4">
                    <i class="bi bi-cloud-arrow-up upload-icon"></i>
                    <h5 class="mb-2">Drag & Drop or Click to Upload</h5>
                    <p class="text-muted small mb-0">Supports JPG, PNG, JPEG</p>
                    <input type="file" name="image" accept="image/*" required id="fileInput">
                </div>

                <!-- Display selected filename -->
                <p id="fileName" class="text-info mb-4" style="display: none;"></p>

                <div class="text-center">
                    <button type="submit" class="btn btn-custom btn-lg w-100">
                        <i class="bi bi-magic me-2"></i> Find Matches
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

<script>
    // Simple script to show the selected file name
    document.getElementById('fileInput').addEventListener('change', function(e) {
        var fileName = e.target.files[0].name;
        var fileNameDisplay = document.getElementById('fileName');
        fileNameDisplay.textContent = 'Selected File: ' + fileName;
        fileNameDisplay.style.display = 'block';
    });
</script>

</body>
</html>

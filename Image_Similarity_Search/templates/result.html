<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container py-5 animate-fade-in">

    <div class="d-flex justify-content-between align-items-center mb-5">
        <h2 class="text-gradient mb-0"><i class="bi bi-stars"></i> Search Results</h2>
        <a href="/" class="btn btn-custom"><i class="bi bi-arrow-left me-2"></i>New Search</a>
    </div>

    <!-- Query Image Section -->
    <div class="row justify-content-center mb-5">
        <div class="col-md-6 text-center animate-slide-up delay-1">
            <h5 class="text-muted mb-3 text-uppercase tracking-wide">Target Image</h5>
            <div class="position-relative d-inline-block">
                <img src="/{{query_image}}" class="query-image">
                <div class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-primary p-2 border border-light">
                    <i class="bi bi-pin-angle-fill"></i> Target
                </div>
            </div>
        </div>
    </div>

    <!-- Results Divider -->
    <div class="d-flex align-items-center mb-5 animate-slide-up delay-2">
        <hr class="flex-grow-1 border-secondary">
        <h4 class="mx-4 text-muted">Top 5 Matches Found</h4>
        <hr class="flex-grow-1 border-secondary">
    </div>

    <!-- Similar Images Grid -->
    <div class="row justify-content-center">
        {% for item in results %}
        <div class="col-lg-4 col-md-6 mb-4 animate-slide-up" style="animation-delay: 0.{{ loop.index + 2 }}s;">
            <div class="glass-card glass-card-hover p-0 h-100 d-flex flex-column">
                <img src="/{{item.image}}" class="w-100 result-image">
                <div class="card-body-glass p-4 text-center flex-grow-1 d-flex flex-column justify-content-center">
                    <span class="text-muted small text-uppercase mb-2">Match Score</span>
                    <div>
                        <span class="badge similarity-badge">
                            <i class="bi bi-lightning-charge-fill text-warning me-1"></i> 
                            {{item.score}}%
                        </span>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

</div>

</body>
</html>
